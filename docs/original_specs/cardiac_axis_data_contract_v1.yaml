# Cardiac-axis project data contract
# Encoding: UTF-8
# This file is the machine-readable source of truth for formal data loading,
# geometry semantics, split usage, version checks, and stop conditions.

contract:
  name: cardiac_axis_data_contract
  version: "1.0"
  status: active
  project: early_pregnancy_fetal_cardiac_axis
  created_date: "2026-08-04"
  timezone: "Asia/Singapore"
  language: "zh-CN"
  yaml_version: "1.2"

  purpose:
    - Freeze the 1474-case formal dataset and deterministic five-fold split.
    - Prevent old experimental outputs from being silently reused as formal results.
    - Freeze case identity, path roles, label semantics, manual-line parsing, and angle conventions.
    - Define cohort roles, leakage boundaries, metric-specific validity, and hard-stop rules.
    - Bind the source-confirmed 15-candidate dictionary to the formal pipeline.

  governing_specifications:
    data_reading_spec:
      identifier: CARDIAC_AXIS_DATA_READING_SPEC_v1.0
      status: governing_reference
    method_history:
      identifier: CARDIAC_AXIS_METHOD_HISTORY_v1.0
      status: historical_reference_only
    candidate_diagnosis_spec:
      identifier: CARDIAC_AXIS_CARD_CANDIDATE_DIAGNOSIS_SPEC_v1.0
      status: governing_reference
    candidate_dictionary:
      identifier: CARDIAC_AXIS_CANDIDATE_DICTIONARY_v1.0
      status: active

  supersession_policy:
    old_experiment_results_are_formal: false
    old_experiment_results_allowed_uses:
      - source_code_provenance
      - historical_method_reconstruction
      - candidate_definition_audit
      - debugging_reference
    old_experiment_results_forbidden_uses:
      - formal_model_selection
      - formal_performance_claims
      - manuscript_main_results
      - manuscript_ablation_results
    formal_experiments_must_restart_from_clean_manifest: true

