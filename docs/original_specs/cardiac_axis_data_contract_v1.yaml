    - id5_obb_mask
    - id4_pca_mask
    - id5_pca_mask

  historical_oracles:
    geometry_oracle:
      candidate_count: 14
      includes_corrected_tree: false
    all_candidate_oracle:
      candidate_count: 15
      includes_corrected_tree: true

  inference_gt_policy:
    manual_axis_used_to_generate_geometry_candidate: false
    manual_axis_used_as_tree_inference_input: false
    manual_axis_allowed_for_error_and_oracle_computation: true

  formal_diagnosis_policy:
    candidate_deletion_before_diagnosis: forbidden
    raw_name_margin_as_final_ambiguity_measure: forbidden
    distinct_axis_clustering_required: true
    external_cohorts_for_route_selection: forbidden

formal_experiment_contract:
  current_stage:
    clean_manifest: complete
    formal_fold: complete
    candidate_dictionary: complete
    fixed_geometry_baseline: pending
    candidate_generation: pending_formal_regeneration
    candidate_diagnosis: pending
    supervised_candidate_selector: pending

  allowed_training_data:
    cohort: retrospective
    prediction_requirement_for_formal_development_metrics: out_of_fold

  forbidden_training_data:
    - multicenter
    - prospective

  model_selection:
    allowed_source: retrospective_out_of_fold_only
    external_metric_ranking: forbidden
    external_threshold_tuning: forbidden
    external_feature_selection: forbidden
    external_architecture_selection: forbidden

  method_constraints:
    endpoint_keypoint_method_for_measurement_line: forbidden
    few_shot_or_small_sample_wording_for_fully_supervised_selector: forbidden
    preferred_selector_terms:
      - supervised_candidate_selector
      - geometry_aware_candidate_selector
      - lightweight_supervised_geometric_selector

  reference_axis_policy:
    primary_improvement_target: card_axis
    reference_axis_must_remain_fixed_unless_explicitly_versioned: true

evaluation_contract:
  clinical_primary_target:
    name: full_angle
    error_type: scalar_absolute_error
    units: degrees

  diagnostic_targets:
    - card_axis
    - reference_axis

  validity_reporting:
    separate_N_valid_required_for:
      - manual_card_axis
      - manual_ref_axis
      - manual_full_angle
      - predicted_card_axis
      - predicted_ref_axis
      - predicted_full_angle
      - each_candidate_axis
    silent_denominator_change: forbidden

  required_strata:
    - overall
    - retrospective_all
    - retrospective_normal
    - retrospective_positive
    - multicenter_all
    - multicenter_normal
    - multicenter_positive
    - prospective_all
    - prospective_normal
    - prospective_positive

  external_reporting:
    multicenter_and_prospective_reported_separately: true
    external_pooling_allowed_for_descriptive_analysis: true
    external_pooling_allowed_for_model_selection: false

  minimum_required_metrics:
    absolute_error:
      - N_valid
      - mean
      - SD
      - median
      - Q1
      - Q3
      - P90
      - P95
      - max
      - accuracy_below_3_deg
      - accuracy_below_5_deg
      - accuracy_below_7_deg
      - accuracy_below_10_deg
      - error_above_10_deg_count
      - error_above_10_deg_percent
    signed_error:
      - N_valid
      - mean_bias
      - SD
      - median
      - Q1
      - Q3

version_chain_contract:
  join_key: uid
  one_to_one_join_required: true

  every_formal_case_table_must_include:
    - uid
    - case_id
    - class
    - cohort

  immutable_set_checks:
    manifest_uid_count: 1474
    fold_uid_count: 1474
    manifest_fold_uid_sets_equal: true

  required_provenance_per_generated_artifact:
    - source_manifest_path
    - source_manifest_sha256
    - source_fold_path
    - source_fold_sha256
    - generating_script_path
    - generating_script_sha256
    - generation_timestamp
    - contract_version
    - feature_or_candidate_version_when_applicable
    - random_seed_when_applicable

  automatic_input_fallback:
    allowed: false
    reason: Different existing files must not silently change the formal version chain.

  automatic_best_method_lookup:
    allowed_for_formal_pipeline: false
    required_behavior: Freeze the selected method name and source artifact explicitly.

stop_conditions:
  hard_fail:
    - condition: manifest_file_missing
    - condition: manifest_sha256_mismatch
    - condition: fold_file_missing
    - condition: fold_sha256_mismatch
    - condition: candidate_dictionary_missing
    - condition: candidate_dictionary_sha256_mismatch
    - condition: manifest_audit_status_not_PASS
    - condition: candidate_dictionary_audit_status_not_PASS
    - condition: manifest_row_count_not_1474
    - condition: fold_row_count_not_1474
    - condition: manifest_uid_not_unique
    - condition: fold_uid_not_unique
    - condition: manifest_and_fold_uid_sets_differ
    - condition: unexpected_class_value
    - condition: unexpected_cohort_value
    - condition: cohort_class_count_mismatch
    - condition: required_formal_path_missing
    - condition: required_formal_path_not_a_file
    - condition: required_path_selection_ambiguous
    - condition: unknown_cohort_file_in_formal_case_set
    - condition: manual_valid_line_count_not_2
    - condition: raw_manual_line_semantics_assumed_from_order
    - condition: manual_line_reselected_per_candidate
    - condition: retrospective_fold_outside_0_to_4
    - condition: retrospective_split_role_not_development_5fold
    - condition: external_fold_not_minus_1
    - condition: external_split_role_not_external_test
    - condition: fold_group_assigned_to_multiple_folds
    - condition: external_data_used_for_model_selection
    - condition: historical_result_used_as_formal_result
    - condition: silent_input_file_fallback
    - condition: silent_duplicate_row_drop
    - condition: candidate_name_set_mismatch
    - condition: inference_candidate_uses_manual_axis
    - condition: cross_image_endpoint_or_center_mapping_used_for_manual_semantics

  metric_specific_invalid_not_global_fail:
    - condition: id4_absent_for_one_case
      action: Recompute card validity from remaining valid card region; report N_valid.
    - condition: id5_absent_for_one_case
      action: Recompute card validity from remaining valid card region; report N_valid.
    - condition: id1_or_id6_absent_for_one_case
      action: Mark reference axis and full angle invalid for that case; report N_valid.
    - condition: candidate_axis_missing_for_one_case
      action: Keep the case in the master table; candidate-specific metric excludes only that value.

pending_formal_artifacts:
  fixed_geometry_case_table:
    status: pending
    path: null
    required_contract_version: "1.0"

  formal_candidate_long_table:
    status: pending
    path: null
    required_candidate_count_per_uid: 15

  formal_candidate_diagnosis_workbook:
    status: pending
    path: null

  supervised_candidate_selector_outputs:
    status: pending
    path: null

implementation_notes:
  - manifest.csv, not manifest_all.csv, is the formal 1474-case input.
  - fold.csv carries the same 1474 UIDs and adds fold assignment fields.
  - The ten incomplete legacy positive records remain diagnostic-only and are not formal cases.
  - Manifest readiness validates path identity, readability, and exactly two manual lines.
  - Manifest readiness does not require every individual label ID to exist in every mask.
  - Manual line endpoints are not anatomical landmarks and must not be converted into a keypoint task.
  - Full-angle error is the clinical primary endpoint; card and reference errors are diagnostic.
  - External cohorts are frozen evaluations and must remain excluded from method selection.
