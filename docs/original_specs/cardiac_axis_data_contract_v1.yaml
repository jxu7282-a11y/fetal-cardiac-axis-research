manual_axis_contract:
  raw_lines:
    count: 2
    raw_names:
      - manual_line0
      - manual_line1
    raw_order_has_no_fixed_semantics: true
    endpoints_have_anatomical_meaning: false
    endpoint_or_keypoint_primary_formulation_allowed: false

  angle_computation:
    each_line_computed_independently: true
    formula: degrees(atan2(p2_y - p1_y, p2_x - p1_x)) modulo 180
    output_range: "[0, 180)"
    cross_image_endpoint_mapping: forbidden
    endpoint_distance_matching: forbidden
    line_overlap_matching: forbidden
    center_mapping_for_semantic_assignment: forbidden

  semantic_assignment:
    required: true
    assignment_scope: one_time_per_case
    candidates:
      assignment_A:
        manual_card_axis: manual_line0_angle
        manual_ref_axis: manual_line1_angle
      assignment_B:
        manual_card_axis: manual_line1_angle
        manual_ref_axis: manual_line0_angle

    selection_rule:
      objective: minimize_total_axial_direction_cost_to_gold_geometry
      total_cost: card_axial_error + ref_axial_error
      gold_card_axis_source: label_gold_fixed_geometry
      gold_ref_axis_source: label_gold_fixed_geometry
      tie_policy:
        silent_arbitrary_choice: forbidden
        required_action:
          - record_both_costs
          - record_assignment_margin
          - flag_for_review

    required_outputs:
      - manual_assignment
      - manual_assignment_cost_A
      - manual_assignment_cost_B
      - manual_assignment_margin
      - manual_card_axis
      - manual_ref_axis
      - manual_full_angle

    freeze_after_assignment: true
    per_candidate_manual_line_reselection: forbidden

angle_contract:
  units: degrees

  axial_direction:
    periodicity: 180.0
    normalize_formula: theta modulo 180
    normalized_range: "[0, 180)"
    signed_difference_formula: "((pred - gt + 90) modulo 180) - 90"
    signed_difference_range: "[-90, 90)"
    absolute_error_formula: absolute_value(signed_axial_difference)

  full_angle:
    meaning: acute_angle_between_card_axis_and_reference_axis
    formula: "min(abs(card - ref) modulo 180, 180 - (abs(card - ref) modulo 180))"
    range: "[0, 90]"
    signed_error_formula: predicted_full_angle - manual_full_angle
    absolute_error_formula: absolute_value(predicted_full_angle - manual_full_angle)

fixed_geometry_contract:
  definition_status: locked
  formal_regeneration_status: pending
  formal_result_path: null
  old_result_path_may_be_used_as_formal: false

  connected_components:
    connectivity: 8
    component_policy: largest_connected_component_per_label

  card_axis:
    label_source_for_prediction: label_infer
    region_ids:
      - 4
      - 5
    region_axis_method: OBB_long_axis
    obb_implementation:
      contour_retrieval: RETR_EXTERNAL
      contour_selection: largest_contour
      rectangle_method: cv2.minAreaRect
      axis_choice: longest_box_edge_direction
    regional_weight: "area * max(OBB_aspect - 1.0, 0.05)"
    fusion_method: 180_degree_double_angle_weighted_mean
    validity:
      minimum_valid_regions: 1
      if_only_one_region_valid: use_that_region_axis
      if_no_region_valid: invalid

  reference_axis:
    label_source_for_prediction: label_infer
    source_region_id: 6
    target_region_id: 1
    point_definition: largest_component_centroid
    direction: id6_centroid_to_id1_centroid
    validity:
      both_centroids_required: true

  full_angle:
    requires_valid_card_axis: true
    requires_valid_reference_axis: true
    computation: acute_angle_between_lines

  gold_geometry_for_manual_assignment:
    same_geometry_rules_as_prediction: true
    label_source: label_gold

