content_validation_contract:
  image:
    reader: cv2.imread
    read_mode: IMREAD_UNCHANGED
    allowed_ndim:
      - 2
      - 3
    nonempty_height_and_width: true

  masks:
    reader: cv2.imread
    read_mode: IMREAD_UNCHANGED
    expected_label_ids:
      - 1
      - 4
      - 5
      - 6
    maximum_selected_channel_unique_values: 64

    channel_selection:
      two_dimensional_mask_selected_channel: -1
      three_dimensional_channel_limit: first_3_channels
      ranking_descending:
        - card_pixel_count
        - expected_label_pixel_count
        - negative_unique_count
      card_label_ids:
        - 4
        - 5

    formal_content_requirements:
      selected_channel_contains_at_least_one_expected_label_pixel: true
      selected_channel_unique_count_at_most_64: true
      every_expected_label_id_required_at_manifest_stage: false

    metric_specific_label_absence_policy:
      global_case_removal: false
      action:
        - mark_relevant_axis_invalid
        - exclude_only_from_that_metric
        - report_metric_specific_N_valid

  axis_label:
    supported_suffixes:
      - .tar
      - .json
    tar_read_mode: r:*
    maximum_tar_member_bytes: 67108864
    accepted_json_encodings_in_order:
      - utf-8
      - utf-8-sig
      - gbk
      - cp936
    measure_model_search: recursive
    measure_model_key: MeasureModel
    line_endpoint_path:
      p1: Pos.p1
      p2: Pos.p2
    minimum_valid_line_length: 1.0e-6
    valid_manual_line_count_required: 2
    truncating_more_than_two_lines: forbidden
    accepting_fewer_than_two_lines: forbidden

