identity_contract:
  uid:
    expression: case_id + "|" + class + "|" + cohort
    separator: "|"
    required: true
    unique: true
    nonempty: true
    expected_unique_count: 1474

  composite_key:
    fields:
      - case_id
      - class
      - cohort
    unique: true
    expected_unique_count: 1474

  patient_and_group_fields:
    patient_id:
      current_source: case_id
      interpretation: unverified_patient_identity
    fold_group_id:
      current_source: case_id
      required_nonempty_for_retrospective: true
    fold_group_source:
      required_value: case_id

  terminology_constraint:
    current_split_may_be_called:
      - case_id_grouped_five_fold
      - case_level_group_aware_five_fold
    current_split_must_not_be_called:
      - patient_level_five_fold
    exception:
      condition: case_id_has_been_independently_confirmed_as_patient_level
      then_patient_level_wording_allowed: true

case_id_normalization:
  input_scope:
    - file_basename
    - not_full_path

  ordered_operations:
    - operation: trim_outer_whitespace
    - operation: replace_backslash_with_forward_slash
    - operation: take_basename
    - operation: repeatedly_remove_known_file_extensions
      extensions:
        - .jpg
        - .jpeg
        - .png
        - .bmp
        - .tif
        - .tiff
        - .json
        - .tar
        - .txt
        - .csv
        - .xlsx
    - operation: remove_confirmed_label_suffixes
      case_insensitive: true
      suffixes:
        - _jpg_Label
        - _jpeg_Label
        - _png_Label
        - _bmp_Label
        - _tif_Label
        - _tiff_Label
        - _Label
        - _label
        - -Label
        - _mask
        - _infer
        - _gold
        - _seg
        - _pred
    - operation: remove_explicit_frame_suffix
      allowed_suffixes:
        - _0000
        - -0000
        - " 0000"
      forbidden_behavior:
        - Do not remove a bare trailing 000 or 0000 without an explicit separator.
        - Do not shorten a valid timestamp ending in zeros.
    - operation: remove_all_remaining_whitespace
    - operation: lowercase

  invalid_normalized_values:
    - ""
    - "."
    - ".."

  hidden_file_policy:
    skip_name_prefix: "."
    skip_path_component: __MACOSX

raw_source_contract:
  data_root:
    path: /data5/xjx/zaoyun/data/j
    read_only: true

  source_groups:
    normal_retrospective_seg:
      class: Ne
      fixed_cohort: retrospective
      requirement: at_least_one_root_exists
      roots:
        - path: /data5/xjx/zaoyun/data/j/正常胎儿/回顾性
          observed_exists_at_manifest_build: true

    normal_retrospective_axis:
      class: Ne
      fixed_cohort: retrospective
      requirement: at_least_one_root_exists
      roots:
        - path: /data5/xjx/zaoyun/data/j/正常胎儿-已标心轴/回顾性-正常
          observed_exists_at_manifest_build: true

    normal_prospective_seg:
      class: Ne
      fixed_cohort: prospective
      requirement: at_least_one_root_exists
      roots:
        - path: /data5/xjx/zaoyun/data/j/正常胎儿/前瞻性
          observed_exists_at_manifest_build: true

    normal_prospective_axis:
      class: Ne
      fixed_cohort: prospective
      requirement: at_least_one_root_exists
      roots:
        - path: /data5/xjx/zaoyun/data/j/正常胎儿-已标心轴/前瞻性-正常
          observed_exists_at_manifest_build: true

    normal_multicenter_seg:
      class: Ne
      fixed_cohort: multicenter
      requirement: at_least_one_root_exists
      roots:
        - path: /data5/xjx/zaoyun/data/j/正常胎儿/多中心
          observed_exists_at_manifest_build: true

    normal_multicenter_axis:
      class: Ne
      fixed_cohort: multicenter
      requirement: at_least_one_root_exists
      roots:
        - path: /data5/xjx/zaoyun/data/j/正常胎儿-已标心轴/多中心-正常
          observed_exists_at_manifest_build: true
        - path: /data5/xjx/zaoyun/data/j/正常胎儿-已标心轴/多中心
          observed_exists_at_manifest_build: false

    positive_seg:
      class: Po
      cohort_source: infer_from_path
      requirement: at_least_one_root_exists
      roots:
        - path: /data5/xjx/zaoyun/data/j/阳性病例
          observed_exists_at_manifest_build: false
        - path: /data5/xjx/zaoyun/data/j/阳性病例_旧的
          observed_exists_at_manifest_build: true

    positive_axis:
      class: Po
      cohort_source: infer_from_path
      requirement: at_least_one_root_exists
      roots:
        - path: /data5/xjx/zaoyun/data/j/阳性病例-心轴
          observed_exists_at_manifest_build: true

  cohort_inference_for_positive_files:
    precedence:
      - match: 前瞻
        cohort: prospective
      - match: 多中心
        cohort: multicenter
      - match: 回顾
        cohort: retrospective
    unresolved_value: unknown
    unresolved_is_blocking: true

file_role_contract:
  allowed_roles:
    - img
    - axis_img
    - label_gold
    - label_infer
    - axis_label

  required_roles_for_formal_case:
    - img
    - label_gold
    - label_infer
    - axis_label

  role_semantics:
    img:
      description: Original image from the segmentation dataset.
      may_be_replaced_by_axis_img: false
    axis_img:
      description: Image stored with the manual cardiac-axis annotation.
      required_for_formal_case: false
      model_input_by_default: false
    label_gold:
      description: Gold segmentation label map.
    label_infer:
      description: Inference segmentation label map used for automated geometry.
    axis_label:
      description: TAR or JSON containing manual MeasureModel lines.

  selection_policy:
    zero_candidates: MISSING
    one_candidate: UNIQUE
    multiple_candidates: AMBIGUOUS
    silent_preferred_path_selection: forbidden
    explicit_override_allowed: true
    explicit_override_requirements:
      - selected_path_exists
      - selected_path_is_one_of_scanned_candidates
      - exact_match_on_case_id_class_cohort_and_role
    allowed_selection_status_for_formal_case:
      - UNIQUE
      - OVERRIDE

